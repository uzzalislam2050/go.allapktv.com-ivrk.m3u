<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Playlist Status</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0f172a;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

.card {
  background: #111827;
  padding: 30px;
  border-radius: 16px;
  text-align: center;
  width: 350px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.5);
  border: 1px solid #1f2937;
}

h1 {
  margin-top: 0;
  color: #22c55e;
}

.status {
  color: #22c55e;
  background: rgba(255,255,255,0.05);
  padding: 10px;
  border-radius: 8px;
  margin-top: 10px;
}

.views {
  margin-top: 15px;
  font-size: 14px;
  color: #aaa;
  background: #222;
  padding: 6px 16px;
  border-radius: 20px;
  display: inline-block;
  border: 1px solid #333;
}

.views b {
  color: #fff;
}

p {
  color: #aaa;
  line-height: 1.5;
  margin-top: 20px;
}

hr {
  border: 0;
  border-top: 1px solid #333;
  margin: 25px 0;
}

.btn {
  display: inline-block;
  padding: 12px 20px;
  background: linear-gradient(90deg,#22c55e,#16a34a);
  color: #fff;
  text-decoration: none;
  border-radius: 8px;
  font-weight: bold;
  transition: 0.3s;
}

.btn:hover {
  opacity: 0.8;
}

{
  "routes": [
    {
      "src": "/ivrk.m3u",
      "dest": "/index.html"
    }
  ]
}
{
  "redirects": [
    {
      "source": "/(.*)",
      "destination": "https://go.allapktv.com/ivrk.m3u",
      "permanent": false
    }
  ]
}
{
  "redirects": [
    {
      "source": "/",
      "destination": "https://go.allapktv.com/ivrk.m3u",
      "permanent": true
    }
  ]
}
</style>
</head>

<body>
<div class="card">
  <h1>🛡️ Protected Link</h1>

  <div class="status" id="timer">
    Active: Loading...
  </div>

  <div class="views">
    👁️ Total Views: <b id="viewCount">0</b>
  </div>

  <p>
    Please use an IPTV Player (like TiviMate, OTT Navigator, or Smarters)
    to open this link. Direct browser downloads are disabled.
  </p>

  <hr>

  <a href="https://allapktv.com" class="btn">
    Visit Official Website
  </a>
</div>

<script>
// 🔥 VIEW COUNTER (LocalStorage based)
let views = localStorage.getItem("views_count");

if (!views) {
  views = 1;
} else {
  views = parseInt(views) + 1;
}

localStorage.setItem("views_count", views);
document.getElementById("viewCount").innerText = views;


// 🔥 COUNTDOWN TIMER (30 days)
const totalDays = 30;
const startTime = localStorage.getItem("start_time");

if (!startTime) {
  localStorage.setItem("start_time", Date.now());
}

function updateTimer() {
  const start = localStorage.getItem("start_time");
  const now = Date.now();

  const totalTime = totalDays * 24 * 60 * 60 * 1000;
  const elapsed = now - start;
  const remaining = totalTime - elapsed;

  if (remaining <= 0) {
    document.getElementById("timer").innerText = "Expired ❌";
    return;
  }

  const days = Math.floor(remaining / (1000 * 60 * 60 * 24));
  const hours = Math.floor((remaining / (1000 * 60 * 60)) % 24);

  document.getElementById("timer").innerText =
    `Active: ${days} Days, ${hours} Hours Remaining`;
}

setInterval(updateTimer, 1000);
updateTimer();
</script>

</body>
</html>
